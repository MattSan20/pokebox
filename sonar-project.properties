#Projecct key
sonar.projectKey=MattSan20_pokebox
#Organization key
sonar.organization=mattsan20

#disply name shown on the SonarQube dashboard
sonar.projectName=pokebox

#app code to analyze
sonar.sources=src
#test code
sonar.tests=tests

#generated folders that aren't source code
sonar.exclusions=**/__pycache__/**,**/*.egg-info/**

#python version
sonar.python.version=3.14
#coverage report created by bytest-cov
sonar.python.coverage.reportPaths=coverage.xml

#file encoding
sonar.sourceEncoding=UTF-8